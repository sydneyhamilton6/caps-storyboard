<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Story — Grief Support Hub</title>
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/pages/story.css">
</head>
<body>
  <div class="page-wrapper">
    <div id="nav-root"></div>

    <main class="page-content" id="main-content">
      <div class="container">

        <a href="stories.html" class="back-nav" aria-label="Back to all stories">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M10 3L5 8l5 5"/>
          </svg>
          All stories
        </a>

        <div id="story-root">
          <!-- Loading state -->
          <div class="story-detail">
            <div class="skeleton" style="height:24px;width:120px;margin-bottom:16px"></div>
            <div class="skeleton" style="height:40px;width:70%;margin-bottom:24px"></div>
            <div class="skeleton" style="height:16px;width:40%;margin-bottom:48px"></div>
            <div class="skeleton" style="height:200px;width:100%"></div>
          </div>
        </div>

      </div>
    </main>

    <footer class="footer" role="contentinfo">
      <div class="container">
        <div class="footer__inner">
          <span class="footer__copy">© 2026 Collective for Hope — Internal Use Only</span>
          <nav class="footer__links" aria-label="Footer navigation">
            <a href="stories.html" class="footer__link">All Stories</a>
            <a href="submit.html"  class="footer__link">Submit</a>
          </nav>
        </div>
      </div>
    </footer>
  </div>

  <script type="module" src="js/pages/story.js"></script>
</body>
</html>
